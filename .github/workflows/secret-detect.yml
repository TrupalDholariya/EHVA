name: Secret Detection

on:
  push:
    branches: [ main ]

env:
  baseline: ".secrets.baseline"
  fail_on_new_findings: "true"

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install detect-secrets
      - run: |
          if [ -f "${{ env.baseline }}" ]; then
            detect-secrets scan --baseline ${{ env.baseline }} --all-files > scan.json || true
            detect-secrets audit --json scan.json || true
          else
            detect-secrets scan --all-files > scan.json || true
          fi
      - name: Fail if new secrets found
        if: ${{ env.fail_on_new_findings == 'true' }}
        run: |
          if jq '.results | length > 0' -e scan.json >/dev/null 2>&1; then
            echo "Secrets detected!"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: secret-scan
          path: scan.json
