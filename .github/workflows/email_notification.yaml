name: PR & Commit Email Notification

on:
  workflow_call:
    inputs:
      email_cc:
        description: "CC addresses (comma-separated)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  get_recipient_email:
    name: 📨 Determine Recipient Email
    runs-on: ubuntu-latest
    outputs:
      user_email: ${{ steps.set_email.outputs.email }}
    steps:
      - uses: actions/checkout@v4

      - name: Set Recipient Email
        id: set_email
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # PR author's email
            email=$(jq -r .pull_request.user.email "$GITHUB_EVENT_PATH")
          else
            # Last commit author's email
            email=$(git log -1 --pretty=format:'%ae')
          fi

          # Fallback to admin if email is empty or noreply
          if [[ -z "$email" || "$email" == *"noreply.github.com"* ]]; then
            email="trupaldholariya2310@gmail.com"
          fi

          echo "email=$email" >> $GITHUB_OUTPUT
          echo "Recipient Email: $email"

  notify:
    name: 📧 Send Email Notification (to contributor)
    needs: get_recipient_email
    uses: ./.github/workflows/email_service.yml
    with:
      to: ${{ needs.get_recipient_email.outputs.user_email }}
      cc: ${{ inputs.email_cc || 'trupaldholariya2310@gmail.com' }}
      sender_name: "GitHub Workflow Bot"
      subject: >-
        📬 [${{ github.repository }}] —
        ${{ github.event_name == 'pull_request'
              && github.event.pull_request.title
              || github.event.head_commit.message }}
      body: |
        <h2>📢 GitHub Activity Notification</h2>
        <p><strong>Repository:</strong> <a href="https://github.com/${{ github.repository }}">${{ github.repository }}</a></p>
        <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
        <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
        <p><strong>Event:</strong> ${{ github.event_name }}</p>
        <p><strong>Timestamp:</strong> ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}</p>

        ${{ github.event_name == 'pull_request'
            && format('<p><strong>PR Title:</strong> {0}</p><p><a href="{1}">🔗 View Pull Request</a></p>',
                      github.event.pull_request.title,
                      github.event.pull_request.html_url)
            || '' }}

        ${{ github.event_name == 'push'
            && format('<p><strong>Commit Message:</strong> {0}</p><p><strong>Commit SHA:</strong> {1}</p><p><a href="{2}">🔗 View Commit</a></p>',
                      github.event.head_commit.message,
                      github.sha,
                      github.event.head_commit.url)
            || '' }}

        <hr/>
        <p>This automated email was sent by <strong>EHVA Security — Universal Email Sender</strong>.</p>
        <p>Workflow logs: <a href="https://github.com/${{ github.repository }}/actions">GitHub Actions</a></p>

    secrets:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}

  verify-success:
    name: ✅ Email Sent Successfully
    runs-on: ubuntu-latest
    needs: notify
    if: ${{ always() && needs.notify.result == 'success' }}
    steps:
      - run: |
          echo "✅ Email notification sent successfully!"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

  fail-on-error:
    name: ❌ Email Failed — Block Push/Merge
    runs-on: ubuntu-latest
    needs: notify
    if: ${{ always() && needs.notify.result == 'failure' }}
    steps:
      - run: |
          echo "❌ Email sending failed. Blocking deployment or merge."
          exit 1
